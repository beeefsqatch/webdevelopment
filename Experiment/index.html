<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Metroidvania Engine</title>

  <style>

    body{
      margin:0;
      background:black;
      overflow:hidden;
    }

    canvas{
      display:block;
      margin:auto;
      background:#0a0a12;
      image-rendering:pixelated;
    }

  </style>

</head>

<body>

<canvas id="game" width="960" height="540"></canvas>
<script src="game.js"></script>

</body>
</html>
<script>
  const canvas = document.getElementById("game")
  const ctx = canvas.getContext("2d")

  const TILE = 32
  const GRAVITY = 0.6

  let keys = {}
  document.addEventListener("keydown",e=>keys[e.key]=true)
  document.addEventListener("keyup",e=>keys[e.key]=false)

  function drawSprite(sprite,x,y,scale=3){

    for(let j=0;j<sprite.length;j++){
      for(let i=0;i<sprite[j].length;i++){

        let color = sprite[j][i]

        if(color !== null){
          ctx.fillStyle = color
          ctx.fillRect(
                  x + i*scale,
                  y + j*scale,
                  scale,
                  scale
          )
        }

      }
    }

  }

  //////////////////////////////////////////////////////////
  // SPRITES
  //////////////////////////////////////////////////////////

  const samusSprite = [

    [null,null,"#f6b26b","#f6b26b","#f6b26b",null,null],
    [null,"#e69138","#e69138","#e69138","#e69138","#e69138",null],
    ["#cc0000","#cc0000","#f6b26b","#f6b26b","#f6b26b","#cc0000","#cc0000"],
    ["#cc0000","#cc0000","#999","#999","#999","#cc0000","#cc0000"],
    [null,"#e69138",null,null,null,"#e69138",null],
    ["#e69138",null,null,null,null,null,"#e69138"]

  ]

  const enemySprite = [

    [null,"#ff00ff","#ff00ff",null],
    ["#ff00ff","#880088","#880088","#ff00ff"],
    ["#ff00ff","#880088","#880088","#ff00ff"],
    [null,"#ff00ff","#ff00ff",null]

  ]

  const itemSprite = [

    [null,"#00ffff",null],
    ["#00ffff","#00ffff","#00ffff"],
    [null,"#00ffff",null]

  ]

  //////////////////////////////////////////////////////////
  // PLAYER
  //////////////////////////////////////////////////////////

  class Player{

    constructor(){

      this.x=100
      this.y=100
      this.w=24
      this.h=40

      this.vx=0
      this.vy=0

      this.health=99

      this.doubleJump=false
      this.canDash=false

      this.jumpCount=0
      this.dir=1

    }

    update(){

      if(keys["ArrowLeft"]){
        this.vx=-3
        this.dir=-1
      }

      else if(keys["ArrowRight"]){
        this.vx=3
        this.dir=1
      }

      else{
        this.vx=0
      }

      if(keys[" "]){
        if(this.onGround){

          this.vy=-12
          this.jumpCount=1

        }
        else if(this.doubleJump && this.jumpCount<2){

          this.vy=-12
          this.jumpCount++

        }
      }

      if(keys["Shift"] && this.canDash){
        this.vx = this.dir * 10
      }

      this.vy += GRAVITY

      this.x += this.vx
      this.y += this.vy

      this.onGround=false

      for(let p of currentRoom.platforms){

        if(rect(this,p)){

          if(this.vy>0){
            this.y=p.y-this.h
            this.vy=0
            this.onGround=true
            this.jumpCount=0
          }

        }

      }

    }

    draw(){

      drawSprite(samusSprite,this.x,this.y)

    }

  }

  //////////////////////////////////////////////////////////
  // ENEMY
  //////////////////////////////////////////////////////////

  class Enemy{

    constructor(x,y){

      this.x=x
      this.y=y
      this.vx=2

    }

    update(){

      this.x+=this.vx

      if(this.x<0||this.x>canvas.width)
        this.vx*=-1

    }

    draw(){

      drawSprite(enemySprite,this.x,this.y)

    }

  }

  //////////////////////////////////////////////////////////
  // ITEM
  //////////////////////////////////////////////////////////

  class Item{

    constructor(x,y,type){

      this.x=x
      this.y=y
      this.type=type

    }

    draw(){

      drawSprite(itemSprite,this.x,this.y)

    }

  }

  //////////////////////////////////////////////////////////
  // ROOM
  //////////////////////////////////////////////////////////

  class Room{

    constructor(data){

      this.platforms=data.platforms
      this.enemies=data.enemies
      this.items=data.items

    }

    draw(){

      ctx.fillStyle="#333"

      for(let p of this.platforms){
        ctx.fillRect(p.x,p.y,p.w,p.h)
      }

      for(let e of this.enemies){
        e.draw()
      }

      for(let i of this.items){
        i.draw()
      }

    }

  }

  //////////////////////////////////////////////////////////
  // WORLDS
  //////////////////////////////////////////////////////////

  const worlds={

    "crateria":{

      "0,0":{
        platforms:[
          {x:0,y:500,w:960,h:40},
          {x:200,y:420,w:200,h:20}
        ],
        enemies:[new Enemy(500,470)],
        items:[new Item(230,380,"doubleJump")]
      },

      "1,0":{
        platforms:[
          {x:0,y:500,w:960,h:40},
          {x:600,y:420,w:200,h:20}
        ],
        enemies:[new Enemy(700,470)],
        items:[new Item(650,380,"dash")]
      }

    },

    "brinstar":{

      "0,0":{
        platforms:[
          {x:0,y:500,w:960,h:40},
          {x:300,y:420,w:200,h:20}
        ],
        enemies:[new Enemy(400,470)],
        items:[new Item(320,380,"health")]
      }

    }

  }

  //////////////////////////////////////////////////////////
  // WORLD NAVIGATION
  //////////////////////////////////////////////////////////

  let world="crateria"
  let roomX=0
  let roomY=0

  function loadRoom(){

    let data = worlds[world][roomX+","+roomY]

    currentRoom = new Room(data)

  }

  let currentRoom
  loadRoom()

  //////////////////////////////////////////////////////////
  // COLLISION
  //////////////////////////////////////////////////////////

  function rect(a,b){

    return(
            a.x < b.x+b.w &&
            a.x+a.w > b.x &&
            a.y < b.y+b.h &&
            a.y+a.h > b.y
    )

  }

  //////////////////////////////////////////////////////////
  // ITEM COLLECTION
  //////////////////////////////////////////////////////////

  function checkItems(){

    for(let i=currentRoom.items.length-1;i>=0;i--){

      let item=currentRoom.items[i]

      if(rect(player,{x:item.x,y:item.y,w:20,h:20})){

        if(item.type=="doubleJump")
          player.doubleJump=true

        if(item.type=="dash")
          player.canDash=true

        if(item.type=="health")
          player.health+=20

        currentRoom.items.splice(i,1)

      }

    }

  }

  //////////////////////////////////////////////////////////
  // ROOM TRANSITION
  //////////////////////////////////////////////////////////

  function checkRoom(){

    if(player.x>canvas.width){

      roomX++
      player.x=10
      loadRoom()

    }

    if(player.x<0){

      roomX--
      player.x=900
      loadRoom()

    }

  }

  //////////////////////////////////////////////////////////
  // GAME LOOP
  //////////////////////////////////////////////////////////

  const player=new Player()

  function update(){

    player.update()

    for(let e of currentRoom.enemies){
      e.update()
    }

    checkItems()
    checkRoom()

  }

  function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    currentRoom.draw()

    player.draw()

    ctx.fillStyle="white"
    ctx.fillText("Energy: "+player.health,20,20)

  }

  function loop(){

    update()
    draw()

    requestAnimationFrame(loop)

  }

  loop()
</script>
