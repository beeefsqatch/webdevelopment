<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do</title>
</head>
<body>

<h1>Luke's To-Do List</h1>

<h1 id="total_time" style="color:red; font-size:50px;">Total Time: 0 min</h1>

<h2>Add a task</h2>
<label>Task Name: </label>
<input id="task" type="text" placeholder="task name...">

<label>Time (min): </label>
<input id="time" type="number" placeholder="minutes..." min="0">

<button id="add" onclick="new_task()">Add</button>

<h2>Tasks</h2>
<div id="task_list"></div>

</body>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #6a915d;
        margin: 25px;
    }

    div.task > input {
        margin-right: 15px;
    }

    #task_list {
        margin-left: 25px;
    }

    div.task {
        background-color: white;
        width: 80%;
        margin-bottom: 10px;
        padding: 15px;
        border-radius: 10px;
    }

    input[type='checkbox']:checked + span {
        color: #700000;
        text-decoration: line-through;
    }

    div.task:has(input[type='checkbox']:checked) {
        background-color: #4f7144;
    }

    div.task:hover {
        background-color: #f1f1f1;
    }
</style>

<script>
    function new_task() {
        let task_input = document.getElementById('task');
        let time_input = document.getElementById('time');

        let task_name = task_input.value.trim();
        let task_time = parseInt(time_input.value);

        if (task_name === "" || isNaN(task_time)) {
            return;
        }

        add_task(task_name, task_time);

        task_input.value = "";
        time_input.value = "";
        task_input.focus();

        update_total_time();
    }

    // ENTER key adds task
    document.getElementById("task").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            new_task();
        }
    });

    function add_task(task_name, task_time) {
        let new_div = document.createElement("div");
        new_div.className = "task";
        new_div.setAttribute("data-time", task_time);

        document.getElementById("task_list").appendChild(new_div);

        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.addEventListener("change", update_total_time);
        new_div.appendChild(checkbox);

        let new_span = document.createElement("span");
        new_span.className = "task_name";
        new_span.innerText = `${task_name} (${task_time} min)`;
        new_div.appendChild(new_span);

        let trash = document.createElement("span");
        trash.innerText = "🗑️";
        trash.style.float = "right";
        trash.style.cursor = "pointer";
        trash.addEventListener("click", function(e){
            e.target.parentElement.remove();
            update_total_time();
        });
        new_div.appendChild(trash);
    }

    function update_total_time() {
        let tasks = document.querySelectorAll(".task");
        let total = 0;

        tasks.forEach(task => {
            let checkbox = task.querySelector("input[type='checkbox']");
            if (!checkbox.checked) {
                total += parseInt(task.getAttribute("data-time"));
            }
        });

        document.getElementById("total_time").innerText = `Total Time: ${total} min`;
    }
</script>
</html>
