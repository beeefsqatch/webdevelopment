<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Countdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: yellowgreen;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        .countdown {
            font-size: 1.5rem;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        input, button {
            padding: 8px;
            margin: 5px;
            font-size: 1rem;
        }
    </style>
</head>

<body>
<div class="container">

    <h1 id="title">Set Your Countdown</h1>

    <!-- User Inputs -->
    <div>
        <input type="text" id="eventName" placeholder="Enter event name">
        <input type="datetime-local" id="dateInput">
        <button onclick="startCountdown()">Start</button>
    </div>

    <!-- Countdown Display -->
    <div class="countdown">
        <div><div id="days">0</div><div>Days</div></div>
        <div><div id="hours">0</div><div>Hours</div></div>
        <div><div id="minutes">0</div><div>Minutes</div></div>
        <div><div id="seconds">0</div><div>Seconds</div></div>
    </div>

</div>

<script>
    let targetDate = null;
    let interval = null;

    function startCountdown() {
        const input = document.getElementById("dateInput").value;
        const eventName = document.getElementById("eventName").value;

        if (!input) {
            alert("Please select a date!");
            return;
        }

        targetDate = new Date(input);

        // Update title
        document.getElementById("title").textContent =
            eventName ? eventName + " is in..." : "Countdown is in...";

        // Clear old interval if exists
        if (interval) clearInterval(interval);

        updateCountdown();
        interval = setInterval(updateCountdown, 1000);
    }

    function updateCountdown() {
        const now = new Date();
        let totalSeconds = Math.floor((targetDate - now) / 1000);

        if (totalSeconds <= 0) {
            clearInterval(interval);
            document.getElementById("title").textContent = "🎉 Time's up!";
            return;
        }

        const days = Math.floor(totalSeconds / 86400);
        totalSeconds %= 86400;

        const hours = Math.floor(totalSeconds / 3600);
        totalSeconds %= 3600;

        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = hours;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("seconds").textContent = seconds;
    }
</script>

</body>
</html>
