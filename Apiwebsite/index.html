<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fish Finder</title>


</head>

<body>

<h1>NOAA Fish Finder</h1>

<input
        type="text"
        id="fishInput"
        placeholder="Enter fish name"
        value="salmon"
>

<button onclick="getFish()">
    Search
</button>

<div id="result">

    <h2 id="fishName"></h2>

    <p>
        <strong>Scientific Name:</strong>
        <span id="scientific"></span>
    </p>

    <p>
        <strong>Habitat:</strong>
        <span id="habitat"></span>
    </p>

    <img id="fishImage" src="" alt="Fish Image">

</div>

<script>

    async function getFish() {

        let fishSearch =
            document.getElementById("fishInput").value.toLowerCase();

        try {

            let response = await fetch(
                "https://www.fishwatch.gov/api/species"
            );

            let data = await response.json();

            console.log(data);

            let fish = data.find(item => {

                return item["Species Name"] &&
                    item["Species Name"]
                        .toLowerCase()
                        .includes(fishSearch);

            });

            if (!fish) {

                alert("Fish not found");

                return;
            }

            document.getElementById("fishName").innerHTML =
                fish["Species Name"];

            document.getElementById("scientific").innerHTML =
                fish["Scientific Name"] || "Unknown";

            document.getElementById("habitat").innerHTML =
                fish["Habitat"] || "No habitat data";

            let image = "";

            if (
                fish["Species Illustration Photo"] &&
                fish["Species Illustration Photo"].src
            ) {

                image =
                    fish["Species Illustration Photo"].src;

            }

            document.getElementById("fishImage").src = image;

            document.getElementById("result").style.display =
                "block";

        }

        catch(error) {

            console.error(error);

            alert("Error loading fish data");

        }

    }

</script>

</body>
</html>
